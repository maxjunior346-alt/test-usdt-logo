<!DOCTYPE html>
<html>
<head>
    <title>USDT TEST</title>
</head>
<body>

<h2>USDT TEST</h2>

<button onclick="addToken()">Add USDT TEST to MetaMask</button>

<p id="status"></p>

<script>
async function addToken() {
    const status = document.getElementById("status");

    if (!window.ethereum) {
        status.innerText = "MetaMask was not detected.";
        return;
    }

    try {
        const wasAdded = await window.ethereum.request({
            method: "wallet_watchAsset",
            params: {
                type: "ERC20",
                options: {
                    address: "0x68055A99dcB33Ac054FDE9D7039DCcCa80DF6Cae",
                    symbol: "USDT",
                    decimals: 6,
                    image: "https://raw.githubusercontent.com/maxjunior346-alt/test-usdt-logo/main/0xdac17f958d2ee523a2206206994597c13d831ec7.png"
                }
            }
        });

        status.innerText = wasAdded
            ? "USDT TEST added."
            : "Token was not added.";

    } catch (error) {
        status.innerText = "Error: " + error.message;
        console.error(error);
    }
}
</script>

</body>
</html>
